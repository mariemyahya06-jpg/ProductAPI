# ===== Profil PROD : base de donnees MySQL =====
# Les valeurs utilisent des variables d'environnement (utile pour le deploiement),
# avec des valeurs par defaut pour un test local.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:productdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Met a jour le schema sans effacer les donnees existantes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Console H2 desactivee en production
spring.h2.console.enabled=false
