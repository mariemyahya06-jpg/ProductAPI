<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Produits</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f6fa; color: #2f3640; }
        h1 { color: #273c75; }
        table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 30px; }
        th, td { border: 1px solid #dcdde1; padding: 10px 12px; text-align: left; }
        th { background: #273c75; color: #fff; }
        tr:nth-child(even) { background: #f1f2f6; }
        form { background: #fff; padding: 20px; border: 1px solid #dcdde1; max-width: 420px; }
        label { display: block; margin: 10px 0 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 16px; padding: 10px 18px; background: #44bd32; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #4cd137; }
    </style>
</head>
<body>
    <h1>Liste des Produits</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prix</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.name}">Nom</td>
                <td th:text="${p.price}">0</td>
                <td th:text="${p.description}">Description</td>
            </tr>
            <tr th:if="${products.isEmpty()}">
                <td colspan="4">Aucun produit pour le moment.</td>
            </tr>
        </tbody>
    </table>

    <h1>Ajouter un Produit</h1>

    <form th:action="@{/products}" th:object="${newProduct}" method="post">
        <label for="name">Nom</label>
        <input type="text" id="name" th:field="*{name}" required>

        <label for="price">Prix</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" required>

        <label for="description">Description</label>
        <input type="text" id="description" th:field="*{description}">

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
